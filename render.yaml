# Implantação grátis para validar integração e webhook. Não usar para clientes:
# o plano Free hiberna e o filesystem/SQLite é apagado ao reiniciar/redeploy.
services:
  - type: web
    name: playtv-cadastro
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements-worker.txt && python -m playwright install chromium --only-shell
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MERCADOPAGO_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CUSTOMER_DB_BACKEND
        value: supabase
      - key: SUPORTE_WHATSAPP
        value: "552799763143"
      - key: PIX_EXPIRATION_MINUTES
        value: 30
      - key: LIVE21_PANEL_URL
        value: https://cms.gerencia.ovh
      - key: LIVE21_PANEL_USERNAME
        sync: false
      - key: LIVE21_PANEL_PASSWORD
        sync: false
      - key: LIVE21_CREDENTIAL_KEY
        sync: false
      - key: LIVE21_TEST_CUSTOMER_PHONE
        sync: false
      - key: LIVE21_INLINE_MODE
        value: "off"
      - key: LIVE21_HEADLESS
        value: "true"
      - key: LIVE21_PROFILE_DIR
        value: .live21-profile
